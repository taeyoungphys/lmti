<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>슈뢰딩거의 타로 — 2026 반도체물리학부 학술제</title>
<style>
:root{
  --bg:#120f24; --ink:#f5ecd7; --gold:#e8c66a; --muted:#b3acd0;
  --cw:clamp(118px,25vw,205px); --ch:calc(var(--cw)*1.7);
  --sw:clamp(80px,17vw,132px);
  --en:"Cinzel",Georgia,serif; --kr:"MaruBuri","Gowun Batang",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#33285e 0%,#1b1638 45%,var(--bg) 80%);color:var(--ink);font-family:var(--kr);overflow-x:hidden;min-height:100vh}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 16px 70px;display:flex;flex-direction:column;align-items:center;text-align:center}
.screen{display:none;width:100%}
.screen.on{display:flex;flex-direction:column;align-items:center;animation:fade .6s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.en{font-family:var(--en)}

/* title */
.orn{font-family:var(--en);color:var(--gold);opacity:.75;letter-spacing:8px;font-size:clamp(12px,2.4vw,16px)}
h1{font-family:var(--en);font-weight:900;line-height:1.02;letter-spacing:clamp(2px,.6vw,6px);margin:10px 0 6px;
  font-size:clamp(40px,9.5vw,104px);
  background:linear-gradient(180deg,#fff4c8 0%,#f1cf6d 45%,#b9862c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px #e8c66a66) drop-shadow(0 4px 0 #3a2a0a)}
h1 small{display:block;font-size:.42em;letter-spacing:.35em;margin-top:.15em}
.sub{color:var(--muted);font-size:clamp(14px,2.6vw,18px);font-family:"Gowun Batang",var(--kr)}
.btn{display:inline-block;border:2px solid var(--gold);background:linear-gradient(#3a2f12,#22190a);color:var(--gold);font-family:var(--kr);
  padding:14px 34px;border-radius:999px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s;margin-top:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px #e8c66a88}

/* intro */
.rules{max-width:560px;margin:24px auto;background:#ffffff0b;border:1px solid #e8c66a33;border-radius:16px;padding:20px 22px;line-height:1.85;font-size:16px}
.rules b{color:var(--gold)}
.intro-cards{display:flex;justify-content:center;gap:clamp(10px,3vw,26px);margin:28px 0 6px}
.intro-cards .card{animation:bob 3s ease-in-out infinite}
.intro-cards .card:nth-child(2){animation-delay:.4s;transform:translateY(-14px)}.intro-cards .card:nth-child(3){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-12px) rotate(1deg)}}

/* cards */
.card{width:var(--cw);height:var(--ch);perspective:1100px;cursor:pointer;flex:none}
.card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.4,.5,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden;box-shadow:0 10px 26px #000a}
.face svg{width:100%;height:100%;display:block}
.front{transform:rotateY(180deg)}

/* slots */
.slots{display:flex;justify-content:center;gap:clamp(12px,4vw,36px);margin:4px 0 6px}
.slot{width:var(--sw);display:flex;flex-direction:column;align-items:center}
.slot .hole,.slot .card{width:var(--sw);height:calc(var(--sw)*1.7)}
.slot .hole{border:2px dashed #6b6390;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#6b6390;font-family:var(--en);font-size:30px;transition:.3s}
.slot.active .hole{border-color:var(--gold);color:var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 28px #e8c66aaa}}
.slot .lbl{margin-top:8px;line-height:1.25}
.slot .lbl .e{font-family:var(--en);font-size:11px;letter-spacing:2px;color:var(--muted)}
.slot .lbl .k{font-size:16px;font-weight:700}
.slot.active .lbl .k{color:var(--gold)}

/* deck */
.stage-title{margin-top:16px}
.stage-title .t{font-family:var(--en);font-size:clamp(24px,5vw,40px);color:var(--gold);letter-spacing:3px}
.stage-title .d{font-size:16px;color:var(--muted);margin-top:4px}
.deck{position:relative;width:100%;height:calc(var(--ch) + 90px);margin:18px auto 0;max-width:1000px}
.deck .card{position:absolute;left:50%;top:26px;margin-left:calc(var(--cw)/-2);transition:transform .55s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.deck .card:hover{z-index:30!important}
.deck.fanned .card:hover .inner{transform:translateY(-22px)}
.deck .card.gone{opacity:0;pointer-events:none}
.hint{color:var(--muted);font-size:15px;min-height:22px;margin-top:4px}
.collapse{font-family:var(--en);color:var(--gold);font-size:clamp(17px,3.4vw,24px);min-height:32px;margin-top:8px}
.collapse.show{animation:pop .7s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* reading */
.r-cards{display:flex;justify-content:center;gap:clamp(10px,3vw,32px);margin:16px 0 8px;--cw:clamp(100px,28vw,240px)}
.r-cards .card{cursor:default}
.r-cards .cap{margin-top:10px;line-height:1.3}
.r-cards .cap .e{font-family:var(--en);font-size:11px;letter-spacing:2px;color:var(--muted)}
.r-cards .cap b{display:block;font-size:16px}
.reading{width:100%;max-width:660px;margin:18px auto 0}
.sec{background:#ffffff0b;border:1px solid #e8c66a2a;border-radius:16px;padding:20px 22px;margin:14px 0;line-height:1.9;font-size:16px;
  opacity:0;transform:translateY(12px);transition:.7s}
.sec.on{opacity:1;transform:none}
.sec h3{font-family:var(--en);font-size:14px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;font-weight:700}
.sec .ctx{display:block;margin-top:12px;padding-top:12px;border-top:1px dashed #e8c66a55;color:#efe3c6}
.sec.egg{border-color:#c08bff88;background:#c08bff14}.sec.egg h3{color:#d7b4ff}
.labbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px}
.labbox .nm{font-size:19px;font-weight:700}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid #ffffff44;margin:2px;color:#ddd}
.result-banner{font-family:var(--en);font-weight:900;font-size:clamp(30px,7vw,60px);letter-spacing:4px;margin-top:4px}
.result-banner.jackpot{color:#ffe27a;text-shadow:0 0 18px #ffcf33,0 0 40px #ff9d00;animation:glow 1.2s infinite alternate}
.result-banner.double{color:#d7b4ff}.result-banner.none{color:var(--muted);font-size:clamp(24px,5vw,40px)}
@keyframes glow{to{text-shadow:0 0 28px #ffe27a,0 0 60px #ff9d00}}
.prize{width:100%;max-width:520px;margin:12px auto;border:2px solid #ffd54a;border-radius:16px;padding:16px;background:#ffd54a14}
.prize .code{font-family:var(--en);font-size:34px;letter-spacing:8px;color:#ffe27a;margin-top:4px}
.r-cards.jackpot .face{box-shadow:0 0 26px #ffd54a,0 0 6px #fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.flyer{position:fixed;z-index:40;pointer-events:none}
.disclaimer{font-size:12px;color:#77709a;margin-top:26px}
/* v3 reading stepper */
.banner-sub{color:#e9dfc6;font-size:16px;margin-top:2px}
.r-cards{--cw:clamp(84px,21vw,160px);margin:14px 0 4px}
.r-cards .rc{transition:transform .35s,opacity .35s,filter .35s;opacity:.42;filter:saturate(.6);cursor:pointer}
.r-cards .rc.active{opacity:1;filter:none;transform:translateY(-8px) scale(1.04)}
.r-cards .rc.active .front{box-shadow:0 0 0 2px #e8c66a,0 12px 30px #000c,0 0 26px #e8c66a66}
#rDots{display:flex;gap:10px;justify-content:center;margin:8px 0 2px}
#rDots span{width:10px;height:10px;border-radius:50%;background:#ffffff33;cursor:pointer;transition:.3s}
#rDots span.on{background:var(--gold);transform:scale(1.3)}
.panel{width:100%;max-width:660px;background:#ffffff0b;border:1px solid #e8c66a2a;border-radius:16px;padding:20px 22px;margin:10px 0;line-height:1.9;font-size:16px;min-height:180px}
.panel.show{animation:fade .5s}
.panel h3{font-family:var(--en);font-size:14px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;font-weight:700}
.panel .ctx{display:block;margin-top:12px;padding-top:12px;border-top:1px dashed #e8c66a55;color:#efe3c6}
.panel .egg{border:1px solid #c08bff88;background:#c08bff14;border-radius:12px;padding:12px 14px;margin-bottom:16px}.panel .egg h3{color:#d7b4ff}
.pnav{display:flex;gap:12px;justify-content:center;align-items:center}
.btn.ghost{background:transparent;border-color:#6b6390;color:var(--muted);font-size:15px;padding:10px 20px}
/* prize */
.prize{position:relative;overflow:hidden;width:100%;max-width:520px;margin:10px auto 4px;border:none;border-radius:18px;padding:18px 16px;background:none;
  box-shadow:0 0 34px #ffd54a77;animation:prizePulse 1.5s ease-in-out infinite}
.prize::before{content:'';position:absolute;inset:-60%;background:conic-gradient(#ffd54a,#fff6c8,#ff9d00,#ffd54a,#fff6c8,#ffd54a);animation:spin 2.6s linear infinite}
.prize::after{content:'';position:absolute;inset:3px;border-radius:15px;background:linear-gradient(160deg,#4a3608,#1d1405)}
.prize>*{position:relative;z-index:1}
.prize .big{font-size:clamp(20px,4.5vw,26px);font-weight:800;color:#ffe27a;margin-bottom:4px}
.prize .code{font-family:var(--en);font-size:38px;letter-spacing:10px;color:#fff3b0;text-shadow:0 0 14px #ffcf33}
.prize .small{font-size:12px;color:#cfc6ea}
.prize.purple{box-shadow:0 0 30px #c08bff77}.prize.purple::before{background:conic-gradient(#c08bff,#f1e0ff,#7a4fd0,#c08bff)}
.prize.purple::after{background:linear-gradient(160deg,#3a2560,#1a1030)}.prize.purple .big{color:#e6d0ff}
@keyframes prizePulse{50%{transform:scale(1.025)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* overlay */
.overlay{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#2a1f4acc 0%,#0b0918ee 70%);cursor:pointer}
.overlay.on{display:flex;animation:fade .3s}
.overlay::before{content:'';position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(#ffd54a22 0 8deg,transparent 8deg 20deg);animation:spin 14s linear infinite;opacity:0;transition:opacity .4s}
.overlay.jackpot::before,.overlay.rule::before{opacity:1}
.overlay.double::before{opacity:1;background:repeating-conic-gradient(#c08bff22 0 8deg,transparent 8deg 20deg)}
.overlay.out{animation:ovOut .45s forwards}
@keyframes ovOut{to{opacity:0}}
#ovBox{position:relative;text-align:center;padding:26px 30px;border-radius:22px;border:2px solid #ffd54a;background:linear-gradient(160deg,#3a2a08f2,#140f22f2);
  box-shadow:0 0 60px #ffd54a88;max-width:92vw;animation:ovIn .7s cubic-bezier(.2,1.6,.4,1)}
.overlay.double #ovBox{border-color:#c08bff;box-shadow:0 0 50px #c08bff88;background:linear-gradient(160deg,#3a2560f2,#140f22f2)}
.overlay.out #ovBox{animation:boxOut .45s forwards}
@keyframes ovIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes boxOut{to{transform:scale(1.25);opacity:0}}
.ov-t{font-family:var(--en);font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:4px;color:#ffe27a;text-shadow:0 0 18px #ffcf33}
.ov-t.big{font-size:clamp(44px,12vw,92px);animation:glow 1s infinite alternate}
.overlay.double .ov-t{color:#e6d0ff;text-shadow:0 0 18px #c08bff}
.ov-cards{display:flex;gap:10px;justify-content:center;margin:14px 0}
.ov-cards .mini{width:clamp(60px,15vw,96px);aspect-ratio:200/340;animation:bob 1.6s ease-in-out infinite}
.ov-cards .mini:nth-child(2){animation-delay:.2s}.ov-cards .mini:nth-child(3){animation-delay:.4s}
.ov-cards svg{width:100%;height:100%;border-radius:7px;box-shadow:0 6px 16px #000a}
.ov-m{font-size:clamp(16px,3.6vw,20px);line-height:1.6}.ov-m b{color:#ffe27a}
.ov-big{font-size:clamp(24px,6vw,36px);font-weight:800;margin-top:6px;color:#fff3b0}
.ov-s{font-size:12px;color:var(--muted);margin-top:8px}
.jp-pill{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;border:2px solid #ffd54a;color:#ffe27a;font-weight:800;font-size:17px;
  background:linear-gradient(90deg,#3a2a08,#5a420c,#3a2a08);background-size:200% 100%;animation:shimmer 2.4s linear infinite,prizePulse 1.5s ease-in-out infinite;box-shadow:0 0 20px #ffd54a55}
@keyframes shimmer{to{background-position:200% 0}}
.collapse small{display:block;font-family:var(--kr);font-size:13px;color:#cfc6ea;margin-top:2px}

/* v4: reveal + 줄바꿈 */
body{word-break:keep-all;overflow-wrap:break-word}
.sub,.rules,.collapse,.ov-m,.banner-sub,.stage-title .d,.labbox,.panel h3,.cap b,.disclaimer,.hint{text-wrap:balance}
.panel,.rules{text-wrap:pretty}
.reveal{display:none;flex-direction:column;align-items:center;margin-top:14px}
.reveal.on{display:flex}
.reveal .card.big{--bw:min(clamp(190px,48vw,300px),calc(52vh/1.7));width:var(--bw);height:calc(var(--bw)*1.7);cursor:default}
.reveal .card.big .front{box-shadow:0 0 0 2px #e8c66a,0 18px 40px #000c,0 0 46px #e8c66a77}
.collapse{max-width:560px;line-height:1.35}
.collapse .ket{display:inline-block;white-space:nowrap;font-size:clamp(18px,4.4vw,28px)}
.collapse small{font-size:clamp(14px,3.4vw,17px);line-height:1.6;margin-top:6px}
.collapse small b{color:var(--gold)}

/* v5: 풀창 한 화면 맞춤 */
#draw{--cw:min(clamp(104px,21vw,180px),calc(31vh/1.7));--sw:min(clamp(66px,13vw,108px),calc(15.5vh/1.7))}
#draw .slots{margin-top:0}
#draw .slot .lbl{margin-top:5px}
#draw .stage-title{margin-top:10px}
#draw .stage-title .t{font-size:clamp(22px,4vw,34px)}
#draw .deck{height:calc(var(--ch) + 64px);margin-top:8px}
#draw .deck .card{top:18px}
.reveal{margin-top:8px}
.reveal .card.big{--bw:min(clamp(150px,36vw,250px),calc(37vh/1.7))}
.collapse{margin-top:30px}
#nextDraw{margin-top:18px!important}
.wrap{padding-top:18px}
#draw .hint{margin-top:10px}

/* v5b */
#draw .wrap,.wrap{padding-bottom:16px}
.collapse:empty{display:none}
#draw.revealing .stage-title,#draw.revealing .hint{display:none}
.rv-wrap{display:flex;flex-direction:column;align-items:center}
.rv-text{display:flex;flex-direction:column;align-items:center}
#draw{--cw:min(clamp(104px,21vw,180px),calc(30vh/1.7))}
.reveal .card.big{--bw:min(clamp(150px,36vw,260px),calc(50vh/1.7))}
@media (min-width:760px){
  .rv-wrap{flex-direction:row;justify-content:center;gap:56px;margin-top:22px}
  .rv-text{max-width:420px}
  .rv-wrap .collapse{margin-top:0}
  .reveal .card.big{--bw:min(clamp(170px,22vw,280px),calc(58vh/1.7))}
}
@media (max-height:760px) and (min-width:760px){
  #draw{--cw:calc(27vh/1.7);--sw:calc(13.5vh/1.7)}
  #draw .stage-title{margin-top:4px}#draw .stage-title .d{margin-top:0}#draw .deck{height:calc(var(--ch) + 46px)}#draw .hint{margin-top:2px}
}

/* v6 */
*{--ch:calc(var(--cw)*1.7)}
.card{height:calc(var(--cw)*1.7)}
.deck .card{transition:transform .4s cubic-bezier(.3,1.3,.5,1),opacity .35s}
#draw.screen.on{min-height:calc(100vh - 34px);justify-content:center}
#draw .deck{height:calc(var(--cw)*1.7 + 100px)}
#draw{--cw:min(clamp(100px,20vw,175px),calc(28vh/1.7))}
@media (max-height:760px) and (min-width:760px){#draw{--cw:calc(25vh/1.7)}#draw .deck{height:calc(var(--cw)*1.7 + 84px)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English+SC&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div id="overlay" class="overlay"><div id="ovBox"></div></div>
<div class="wrap">

  <!-- INTRO -->
  <section id="intro" class="screen on">
    <div class="orn">✦ ─── 2026 ─── ✦</div>
    <h1>SCHRÖDINGER'S<small>TAROT</small></h1>
    <p class="sub">슈뢰딩거의 타로 · 반도체물리학부 학술제</p>
    <div class="intro-cards" id="introCards"></div>
    <div class="rules">
      관측하기 전까지 당신의 대학원 운명은 <b>중첩 상태</b>예요.<br>
      <b>과거 · 현재 · 미래</b> 세 장을 뽑아 파동함수를 붕괴시켜 보세요.<br>
    </div>
    <div class="jp-pill">🎰 세 장 모두 같은 연구실 = JACKPOT 🎁</div><br>
    <button class="btn" id="startBtn">관측 시작 🔭</button>
  </section>

  <!-- DRAW -->
  <section id="draw" class="screen">
    <div class="slots" id="slots"></div>
    <div class="stage-title"><div class="t" id="stTitle"></div><div class="d" id="stDesc"></div></div>
    <div class="deck" id="deck"></div>
    <div class="hint" id="hint"></div>
    <div class="rv-wrap" id="rvWrap"><div class="reveal" id="reveal"></div>
    <div class="rv-text"><div class="collapse" id="collapse"></div>
    <button class="btn" id="nextDraw" style="display:none">다음 카드 뽑기 →</button></div></div>
    <button class="btn" id="readBtn" style="display:none;margin-top:14px">운명 해석 보기 🔮</button>
  </section>

  <!-- READING -->
  <section id="read" class="screen">
    <div class="result-banner" id="banner"></div><div class="banner-sub" id="bannerSub"></div>
    <div id="prizeBox"></div>
    <div class="r-cards" id="rCards"></div>
    <div id="rDots"></div>
    <div class="panel" id="panel"></div>
    <div class="pnav"><button class="btn ghost" id="prevBtn">← 이전</button><button class="btn" id="nextBtn">다음 카드 →</button></div>
    <button class="btn ghost" id="againBtn" style="margin-top:16px">다시 관측하기 ↺</button>
    <p class="disclaimer">본 타로는 학술제용 재미 콘텐츠이며, 실제 교수님·연구실을 평가한 결과가 아닙니다.</p>
  </section>
</div>

<script>
/* =========================================================
   CONFIG — 부스 운영용
   ?boost=0.15  → 15% 확률로 잭팟 강제(상품 소진 속도 조절)
   ?force=jackpot | double  → 리허설용
   ========================================================= */
const params = new URLSearchParams(location.search);
const CONFIG = {
  showProfNames: true,                       // 교수님 성함 노출 (사전 동의 필요)
  boost: parseFloat(params.get('boost')||'0'),
  force: params.get('force')
};

/*DATA_START*/
/* ---------------- LAB DATA (연구실 성향 조사 질문지 기반) ---------------- */
const LABS = {

  <path d="M14 300 H186 L178 313 L186 326 H14 L22 313 Z" fill="#f3e3bb" stroke="#2a1d10" stroke-width="1.5"/>
  <path d="M26 303 H174 M26 323 H174" stroke="#b8913a" stroke-width=".7"/>
  <text x="100" y="318" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="${fs}" font-weight="700" letter-spacing=".5" fill="#2a1d10" ${c.title.length>14?'textLength="146" lengthAdjust="spacingAndGlyphs"':''}>${c.title}</text>
  <rect x="2" y="2" width="196" height="336" filter="url(#gr${u})" clip-path="url(#cc${u})" opacity=".55" style="mix-blend-mode:multiply"/>
  <rect x="2" y="2" width="196" height="336" rx="10" fill="none" stroke="#2a1d10" stroke-width="3"/>
  </svg>`;
}
function backSVG(th){
  return `<svg viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="196" height="336" rx="10" fill="${th.back}" stroke="${th.acc}" stroke-width="4"/>
  <rect x="12" y="12" width="176" height="316" rx="6" fill="none" stroke="${th.acc}" stroke-width="1.5" stroke-dasharray="2 4"/>
  ${dots(26,th.key.length*17,th.acc,20,20,160,300,1.2)}
  <circle cx="100" cy="166" r="64" fill="none" stroke="${th.acc}" stroke-width="1.5"/>
  <ellipse cx="100" cy="166" rx="64" ry="22" fill="none" stroke="${th.acc}" stroke-width="1" transform="rotate(60 100 166)"/>
  <ellipse cx="100" cy="166" rx="64" ry="22" fill="none" stroke="${th.acc}" stroke-width="1" transform="rotate(-60 100 166)"/>
  <rect x="70" y="156" width="60" height="44" fill="${th.back}" stroke="${th.acc}" stroke-width="2"/>
  <polygon points="84,156 88,142 94,152 106,152 112,142 116,156" fill="${th.acc}"/>
  <circle cx="93" cy="160" r="2.6" fill="${th.back}"/><circle cx="107" cy="160" r="2.6" fill="${th.back}"/>
  <text x="100" y="189" text-anchor="middle" font-family="Cinzel,Georgia" font-size="18" fill="${th.acc}">?</text>
  <text x="100" y="62" text-anchor="middle" font-family="Georgia" font-size="26" fill="${th.acc}">${th.glyph}</text>
  <text x="100" y="292" text-anchor="middle" font-family="Cinzel,Georgia" font-weight="700" font-size="14" letter-spacing="3" fill="${th.acc}">${th.en}</text>
  <text x="100" y="313" text-anchor="middle" font-family="MaruBuri,'Gowun Batang',serif" font-size="13" fill="${th.acc}">${th.ko}</text>
  </svg>`;
}
function cardEl(theme, card, flipped=false){
  const d=document.createElement('div');d.className='card'+(flipped?' flipped':'');
  d.innerHTML=`<div class="inner"><div class="face back">${backSVG(theme)}</div><div class="face front">${card?faceSVG(card):''}</div></div>`;
  return d;
}

/* ---------------- background stars ---------------- */
(function(){const c=document.getElementById('stars'),x=c.getContext('2d');let st=[];
 function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:110},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4,p:Math.random()*6}))}
 rs();addEventListener('resize',rs);
 (function f(t){x.clearRect(0,0,c.width,c.height);st.forEach(s=>{x.globalAlpha=.3+.7*Math.abs(Math.sin(t/1400+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(f)})(0);
})();

/* ---------------- state ---------------- */
let step=0, picks=[], order=[], locked=false, forced=false;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo({top:0,behavior:'smooth'})}

/* intro decor */
THEMES.forEach(t=>$('introCards').appendChild(cardEl(t)));

function buildSlots(){
  const s=$('slots');s.innerHTML='';
  THEMES.forEach((t,i)=>{const d=document.createElement('div');d.className='slot'+(i===step?' active':'');d.id='slot'+i;
    d.innerHTML=`<div class="hole">?</div><div class="lbl"><div class="e">${t.en.replace('THE ','')}</div><div class="k">${t.ko}</div></div>`;s.appendChild(d)});
}

async function startStage(){
  locked=true;
  const th=THEMES[step];
  document.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('active',i===step));
  $('stTitle').textContent=th.en;
  $('stDesc').textContent=th.sub;
  $('hint').textContent='셔플 중… 파동함수를 섞는 중';
  $('collapse').textContent='';$('collapse').classList.remove('show');
  const deckCards=CARDS.filter(c=>c.theme===th.key);
  order=shuffle(deckCards);
  const deck=$('deck');deck.innerHTML='';deck.classList.remove('fanned');
  const els=order.map((c,i)=>{const e=cardEl(th);e.style.transform=`translateY(-30px) rotate(${(Math.random()-.5)*6}deg)`;e.style.zIndex=i;deck.appendChild(e);return e});
  await sleep(60);
  // riffle shuffle
  for(let r=0;r<2;r++){
    els.forEach((e,i)=>{e.style.transform=`translateX(${(i%2?1:-1)*(40+Math.random()*20)}px) rotate(${(i%2?1:-1)*8}deg)`});
    await sleep(170);
    els.forEach((e,i)=>{e.style.transform=`translate(${(Math.random()-.5)*6}px,${-i*1.5}px) rotate(${(Math.random()-.5)*4}deg)`;e.style.zIndex=(i*7+r*3)%els.length});
    await sleep(170);
  }
  // fan out
  const n=els.length, cw=els[0].offsetWidth, W=deck.offsetWidth;
  const gap=Math.min(cw*0.62,(W-cw)/(n-1));
  els.forEach((e,i)=>{const k=i-(n-1)/2;e.style.zIndex=i;e.style.transform=`translate(${k*gap}px,${k*k*6}px) rotate(${k*4.5}deg)`;
    e.onclick=()=>pick(i,e)});
  deck.classList.add('fanned');
  await sleep(320);
  $('hint').textContent='마음이 끌리는 카드 한 장을 고르세요';
  locked=false;
}

function chooseCard(i){
  let card=order[i];
  const th=THEMES[step].key;
  // 운영자 옵션: 잭팟 부스트 / 리허설 강제
  if(step===0) forced = CONFIG.force==='jackpot' || Math.random()<CONFIG.boost;
  const want = step>0 && (forced || (CONFIG.force==='double'&&step===1));
  if(want){const m=CARDS.find(c=>c.theme===th&&c.lab===picks[0].lab);if(m)card=m}
  return card;
}

async function pick(i,el){
  if(locked)return;locked=true;
  const card=chooseCard(i), th=THEMES[step], last=step===2;
  $('hint').textContent='';
  [...$('deck').children].forEach(e=>{if(e!==el){e.classList.add('gone');e.style.transform+=' translateY(60px)'}});
  el.style.transform+=' translateY(-34px) scale(1.08)';
  await sleep(380);
  // 1) 뽑은 카드를 크게 확대해서 중앙에
  const from=el.getBoundingClientRect();
  $('deck').style.display='none';
  const rv=$('reveal');rv.innerHTML='';rv.classList.add('on');$('draw').classList.add('revealing');
  const big=cardEl(th,card);big.classList.add('big');rv.appendChild(big);
  const to=big.getBoundingClientRect();
  const dx=from.left+from.width/2-(to.left+to.width/2), dy=from.top+from.height/2-(to.top+to.height/2), sc=from.width/to.width;
  await big.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`},{transform:`translate(${dx*.3}px,${dy*.3-30}px) scale(${(sc+1)/2}) rotate(-8deg)`,offset:.5},{transform:'none'}],
    {duration:850,easing:'cubic-bezier(.5,0,.3,1)'}).finished;
  big.classList.add('flipped');
  await sleep(500);
  burst(big.getBoundingClientRect(),LABS[card.lab].color,44);
  // 2) 메시지 — 버튼 누를 때까지 유지
  const cl=$('collapse');
  cl.innerHTML=`<span class="ket">|ψ⟩ → |${card.title}⟩</span><small>관측 성공! 중첩돼 있던 운명이<br><b>‘${card.kr}’</b> 카드로 붕괴했어요</small>`;
  cl.classList.remove('show');void cl.offsetWidth;cl.classList.add('show');
  const nb=$('nextDraw');nb.textContent=last?'운명 해석 보기 🔮':'다음 카드 뽑기 →';nb.style.display='inline-block';
  await new Promise(r=>nb.onclick=r);
  nb.style.display='none';cl.innerHTML='';
  // 3) 슬롯으로 이동
  scrollTo({top:0,behavior:'smooth'});await sleep(350);
  const hole=$('slot'+step).querySelector('.hole'), f2=big.getBoundingClientRect(), t2=hole.getBoundingClientRect();
  const fly=cardEl(th,card,true);fly.classList.add('flyer');
  Object.assign(fly.style,{left:t2.left+'px',top:t2.top+'px',width:t2.width+'px',height:t2.height+'px'});
  document.body.appendChild(fly);rv.classList.remove('on');rv.innerHTML='';$('draw').classList.remove('revealing');
  const dx2=f2.left+f2.width/2-(t2.left+t2.width/2), dy2=f2.top+f2.height/2-(t2.top+t2.height/2);
  await fly.animate([{transform:`translate(${dx2}px,${dy2}px) scale(${f2.width/t2.width})`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.5,0,.3,1)'}).finished;
  hole.replaceWith(Object.assign(fly,{className:'card flipped'}));fly.removeAttribute('style');
  picks.push(card);step++;
  $('deck').style.display='';
  if(!last) startStage();
  else{await sleep(350);show('read');buildReading()}
}

/* ---------------- reading engine ---------------- */
function particle(n){return /[가-힣]/.test(n)&&((n.charCodeAt(n.length-1)-0xAC00)%28)?'으로':'로'}
let RS={step:0,secs:[],mode:'none'};
function buildReading(){
  const [L,P,St]=picks;
  const counts={};picks.forEach(c=>counts[c.lab]=(counts[c.lab]||0)+1);
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const mode=counts[top]===3?'jackpot':counts[top]===2?'double':'none';
  const rec= mode==='none'?P.lab:top;
  RS.mode=mode;

  const banner=$('banner');banner.className='result-banner '+mode;
  banner.textContent={jackpot:'★ JACKPOT ★',double:'2 / 3 MATCH',none:'SUPERPOSITION'}[mode];
  $('bannerSub').innerHTML={jackpot:`세 장 모두 <b>${labCode(rec)}</b>!`,double:`두 장이 <b>${labCode(rec)}</b>를 가리켜요`,none:'세 장 모두 다른 연구실 — 아직 중첩 상태'}[mode];

  const rc=$('rCards');rc.className='r-cards'+(mode==='jackpot'?' jackpot':'');rc.innerHTML='';
  picks.forEach((c,i)=>{const w=document.createElement('div');w.className='rc';const e=cardEl(THEMES[i],c);w.appendChild(e);
    w.insertAdjacentHTML('beforeend',`<div class="cap"><div class="e">${THEMES[i].en}</div><b>${c.kr}</b></div>`);
    w.onclick=()=>goStep(i);rc.appendChild(w);setTimeout(()=>e.classList.add('flipped'),250+i*300)});

  const profName = CONFIG.showProfNames?`${LABS[P.lab].prof} 교수님`:`${labCode(P.lab)} 교수님`;
  const ctxP = P.ctx[LABS[L.lab].tag], ctxS = St.ctx[LABS[P.lab].tag];
  const secs=[];
  secs.push(`<h3>I · THE PAST — ${labCode(L.lab)}</h3>${L.read}`);
  secs.push(`<h3>II · THE PRESENT — ${profName}</h3>${P.read}
     <span class="ctx">그런데 <b>‘${L.kr}’</b> 옆에 놓인 ‘${P.kr}’는 <b>${ctxP}</b>${particle(ctxP)} 읽혀요.</span>`);
  secs.push(`<h3>III · THE FUTURE — ${labCode(St.lab)} 대학원생</h3>${St.read}
     <span class="ctx">그리고 ‘${P.kr}’의 기운을 받은 이 미래는 <b>${ctxS}</b>${particle(ctxS)} 완성돼요.</span>`);

  const ids=picks.map(c=>c.id);
  const eggs=EGGS.filter(e=>e.ids.every(x=>ids.includes(x)));
  const R=LABS[rec];
  let synth;
  if(mode==='jackpot') synth=`세 장 모두 <b>${labCode(rec)}</b>! 파동함수가 하나의 상태로 완전히 붕괴했어요. 1/${N_LABS*N_LABS} 확률을 뚫은 운명 — 이건 우연이 아니라 <b>관측된 진로</b>예요.`;
  else if(mode==='double') synth=`<b>${labCode(rec)}</b>의 기운이 두 장. 운명의 확률 진폭이 ${labCode(rec)} 쪽으로 기울어 있어요. 잭팟은 아깝게 놓쳤지만, 간섭무늬의 <b>가장 밝은 줄</b>에 서 있는 셈이에요.`;
  else synth=`세 장이 모두 다른 연구실 — 당신의 운명은 아직 <b>중첩 상태</b>예요. 대학원은 직접 관측하는 순간 붕괴하니까, 지금 당신을 이끄는 <b>${labCode(rec)}</b>부터 관측해 보는 건 어때요?`;
  const nm = R.name.startsWith(labCode(rec))?R.name:`${labCode(rec)} · ${R.name}`;
  secs.push(`${eggs.map(e=>`<div class="egg"><h3>✦ HIDDEN COUPLING</h3>${e.t}</div>`).join('')}
    <h3>VERDICT — 운명의 연구실</h3>${synth}
    <div class="labbox"><div class="nm"><span style="color:${R.color}">●</span> ${nm}</div>
    <div style="color:#cfc6ea;font-size:14px">${R.one}</div>
    <div>${R.kw.map(k=>`<span class="tag">${k}</span>`).join('')}</div>
    <div style="font-size:15px">“${R.msg}”</div>
    <div style="font-weight:700;color:${/없음/.test(R.recruit)?'#a9a3c4':'#8ef0a8'}">${R.recruit}</div></div>
    <span class="ctx">${rec==='HSL'
      ? '🦥 HSL은 지금 은둔 중… 대신 복도에서 교수님을 뵈면 <b>인사부터</b> 드려 보세요. 그게 이 카드의 진짜 미션이에요.'
      : `📍 ${labCode(rec)} 대학원생에게 <b>“타로 보고 왔어요”</b> 한마디 건네 보세요. 진짜 연구실 이야기를 들려줄 거예요.`}</span>`);
  RS.secs=secs;

  const code=String(Math.floor(1000+Math.random()*9000)), tt=new Date().toTimeString().slice(0,5);
  $('prizeBox').innerHTML = mode==='jackpot'
    ? `<div class="prize"><div class="big">🎁 잭팟 경품 당첨!</div><div>이 화면을 부스 진행자에게 보여주세요</div><div class="code">${code}</div><div class="small">${tt} 발급 · 1회 한정</div></div>`
    : mode==='double' ? `<div class="prize purple"><div class="big">🍬 2/3 일치 — 참가 간식 증정!</div><div>이 화면을 부스 진행자에게 보여주세요</div></div>` : '';

  $('rDots').innerHTML=[0,1,2,3].map(i=>`<span data-i="${i}"></span>`).join('');
  [...$('rDots').children].forEach(d=>d.onclick=()=>goStep(+d.dataset.i));
  goStep(0,true);
  if(mode==='jackpot') setTimeout(()=>popup('jackpot',rec),500);
  else if(mode==='double') setTimeout(()=>popup('double',rec),500);
}
function goStep(i,first){
  RS.step=i;const p=$('panel');
  [...$('rCards').children].forEach((c,k)=>c.classList.toggle('active',i===3||k===i));
  [...$('rDots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  p.classList.remove('show');void p.offsetWidth;p.innerHTML=RS.secs[i];p.classList.add('show');
  $('prevBtn').style.visibility=i>0?'visible':'hidden';
  $('nextBtn').style.display=i<3?'inline-block':'none';
  $('nextBtn').textContent=i===2?'운명의 연구실 보기 →':'다음 카드 →';
  if(!first) $('rCards').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------------- popups ---------------- */
function popup(kind,lab,dur){
  const ov=$('overlay'),box=$('ovBox');
  ov.className='overlay on '+kind;
  if(kind==='rule'){
    box.innerHTML=`<div class="ov-t">JACKPOT RULE</div><div class="ov-cards">${THEMES.map(t=>`<div class="mini">${backSVG(t)}</div>`).join('')}</div>
      <div class="ov-m">과거 · 현재 · 미래<br><b>세 장이 모두 같은 연구실</b>이면</div><div class="ov-big">🎁 경품 증정!</div><div class="ov-s">화면을 누르면 시작해요</div>`;dur=dur||3200;
  }else if(kind==='jackpot'){
    box.innerHTML=`<div class="ov-t big">JACKPOT</div><div class="ov-cards">${picks.map(c=>`<div class="mini">${faceSVG(c)}</div>`).join('')}</div>
      <div class="ov-m">세 장 모두 <b>${labCode(lab)}</b>!<br>1/${N_LABS*N_LABS} 확률을 뚫었어요</div><div class="ov-big">🎁 경품 당첨</div>`;dur=dur||4200;
    confetti(4200);
  }else{
    box.innerHTML=`<div class="ov-t">2 / 3 MATCH</div><div class="ov-m">두 장이 <b>${labCode(lab)}</b>를 가리켜요</div><div class="ov-big">🍬 참가 간식 증정</div>`;dur=dur||2400;
  }
  return new Promise(res=>{let done=false;const close=()=>{if(done)return;done=true;ov.classList.add('out');setTimeout(()=>{ov.className='overlay';res()},450)};
    ov.onclick=close;setTimeout(close,dur)});
}

/* ---------------- FX ---------------- */
const fx=$('fx'),fc=fx.getContext('2d');let parts=[],running=false;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}sizeFx();addEventListener('resize',sizeFx);
function loop(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.life--;p.rot+=p.vr;fc.save();fc.globalAlpha=Math.min(1,p.life/30);fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillStyle=p.c;
    if(p.shape==='rect')fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.shape==='psi'){fc.font=`${p.s*2}px Georgia`;fc.fillText(p.t,0,0)}else{fc.beginPath();fc.arc(0,0,p.s/2,0,7);fc.fill()}fc.restore()});
  if(parts.length)requestAnimationFrame(loop);else running=false}
function kick(){if(!running){running=true;requestAnimationFrame(loop)}}
function burst(r,c,n){const cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const a=Math.random()*7,v=2+Math.random()*4;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,life:50+Math.random()*30,s:3+Math.random()*4,c:Math.random()<.5?c:'#ffe9a8',shape:'dot',rot:0,vr:0})}kick()}
function confetti(ms){const end=Date.now()+ms;const cols=['#ffd54a','#e2553c','#2fae63','#4a7fd0','#9a5cf0','#fff'];
  (function spawn(){for(let i=0;i<8;i++)parts.push({x:Math.random()*fx.width,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.04,life:220,s:8+Math.random()*6,
    c:cols[Math.random()*cols.length|0],shape:Math.random()<.15?'psi':'rect',t:['ψ','ħ','∞','★'][Math.random()*4|0],rot:Math.random()*6,vr:(Math.random()-.5)*.2});kick();if(Date.now()<end)setTimeout(spawn,60)})()}

/* ---------------- wiring ---------------- */
$('startBtn').onclick=async()=>{await popup('rule');step=0;picks=[];$('deck').style.height='';$('deck').style.display='';$('nextDraw').style.display='none';$('readBtn').style.display='none';show('draw');buildSlots();setTimeout(startStage,300)};
$('readBtn').onclick=()=>{show('read');buildReading()};
$('againBtn').onclick=()=>{show('intro')};
$('prevBtn').onclick=()=>goStep(Math.max(0,RS.step-1));
$('nextBtn').onclick=()=>goStep(Math.min(3,RS.step+1));
</script>
